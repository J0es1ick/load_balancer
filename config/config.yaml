server:
  port: "8080"
  access_log_sample_rate: 0.01
  access_log_include_path: false
  trusted_proxies:
    - "127.0.0.1/32"
    - "::1/128"
    - "172.30.0.250/32"
    - "172.30.0.251/32"
  read_header_timeout: "5s"
  read_timeout: "30s"
  write_timeout: "0s"
  idle_timeout: "60s"
  shutdown_timeout: "10s"
  max_header_bytes: 1048576
  upstream:
    dial_timeout: "2s"
    tls_handshake_timeout: "3s"
    response_header_timeout: "10s"
    expect_continue_timeout: "1s"
    idle_conn_timeout: "90s"
    max_idle_conns: 256
    max_idle_conns_per_host: 64
    max_conns_per_host: 0
    max_concurrent_requests: 512
  retry:
    max_attempts: 2
    per_try_timeout: "5s"
    body_limit: 1048576
    methods: ["GET", "HEAD", "OPTIONS"]
    statuses: [502, 503, 504]
    budget_capacity: 100
    budget_refill_per_second: 10
  overload:
    max_concurrent_requests: 2048
    queue_timeout: "50ms"

management:
  enabled: true
  address: ":9090"
  auth_token_env: "BALANCER_ADMIN_TOKEN"
  allow_insecure: false
  enable_pprof: false
  runtime_mutations: true
  write_timeout: "30s"
  metrics_address: ":9091"
  metrics_auth_token_env: "BALANCER_METRICS_TOKEN"
  credentials:
    - name: "console-viewer"
      role: "viewer"
      token_env: "BALANCER_VIEWER_TOKEN"
    - name: "console-operator"
      role: "operator"
      token_env: "BALANCER_OPERATOR_TOKEN"
    - name: "discovery-controller"
      role: "discovery"
      token_env: "BALANCER_DISCOVERY_TOKEN"

gateway:
  apiVersion: "proxy/v1"
  history_limit: 10
  listeners:
    - id: "http"
      address: ":8080"
      protocol: "http1"
      default: true
  routes:
    - id: "canary"
      listener: "http"
      priority: 30
      match: {path_prefix: "/canary/"}
      action:
        weighted_clusters:
          - {cluster: "primary", weight: 90}
          - {cluster: "canary", weight: 10}
        rewrite_prefix: "/"
      max_request_body_bytes: 10485760
    - id: "api"
      listener: "http"
      priority: 20
      match: {path_prefix: "/api/"}
      action: {cluster: "primary", rewrite_prefix: "/"}
      max_request_body_bytes: 10485760
    - id: "default"
      listener: "http"
      priority: 0
      match: {path_prefix: "/"}
      action: {cluster: "primary"}
      max_request_body_bytes: 10485760
  clusters:
    - id: "primary"
      strategy: "round_robin"
      health: {enabled: true}
      endpoints:
        - {id: "backend-1", url: "http://backend1:80"}
        - {id: "backend-2", url: "http://backend2:80"}
        - {id: "backend-3", url: "http://backend3:80", disabled: true}
        - {id: "backend-4", url: "http://backend4:80", disabled: true}
        - {id: "backend-5", url: "http://backend5:80", disabled: true}
        - {id: "backend-6", url: "http://backend6:80", disabled: true}
        - {id: "backend-7", url: "http://backend7:80", disabled: true}
        - {id: "backend-8", url: "http://backend8:80", disabled: true}
    - id: "canary"
      strategy: "round_robin"
      health: {enabled: true}
      endpoints:
        - {id: "canary-1", url: "http://backend7:80"}
        - {id: "canary-2", url: "http://backend8:80"}

redis:
  address: "redis:6379"
  database: 0
  pool_size: 64
  dial_timeout: "2s"
  read_timeout: "50ms"
  write_timeout: "50ms"

database:
  host: "postgres"
  port: "5432"
  user: "postgres"
  password_env: "POSTGRES_PASSWORD"
  name: "balancer"
  sslmode: "disable"
  connect_timeout: "5s"
  max_open_connections: 25

rate_limit:
  enabled: true
  storage: "redis"
  failure_mode: "local-fallback"
  capacity: 100
  refill_per_second: 1
  operation_timeout: "50ms"
  local_shards: 64
  local_max_buckets: 100000
  ipv4_prefix_bits: 32
  ipv6_prefix_bits: 64
  cleanup_interval: "6h"
  retention: "24h"

health_check:
  mode: "http"
  path: "/"
  interval: "5s"
  timeout: "2s"
  failure_threshold: 2
  success_threshold: 1
  max_concurrency: 16
  jitter: "500ms"
  cooldown: "10s"
  slow_start: "30s"
  slow_start_minimum_percent: 10
  expected_statuses: [200, 204]
