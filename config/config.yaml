server:
  port: "8080"
  trusted_proxies:
    - "127.0.0.1/32"
    - "::1/128"
    - "172.30.0.10/32"
  read_header_timeout: "5s"
  read_timeout: "15s"
  write_timeout: "30s"
  idle_timeout: "60s"
  shutdown_timeout: "5s"
  max_header_bytes: 1048576

database:
  host: "postgres"
  port: "5432"
  user: "postgres"
  password: "12345"
  name: "balancer"
  sslmode: "disable"
  connect_timeout: "5s"

backends:
  - "http://backend1:80"
  - "http://backend2:80"

rate_limit:
  default_capacity: 100
  default_rate: "1s"

health_check:
  interval: "5s"
  timeout: "2s"
