{{- $config := deepCopy .Values.config -}}
{{- if .Values.managementTLS.enabled -}}
{{- $management := get $config "management" -}}
{{- $_ := set $management "tls" (dict
      "cert_file" "/var/run/secrets/balancer-tls/tls.crt"
      "key_file" "/var/run/secrets/balancer-tls/tls.key"
      "ca_file" "/var/run/secrets/balancer-tls/ca.crt"
      "require_client_cert" .Values.managementTLS.requireClientCert) -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-load-balancer.fullname" . }}-config
  labels:
    {{- include "go-load-balancer.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml $config | nindent 4 }}
