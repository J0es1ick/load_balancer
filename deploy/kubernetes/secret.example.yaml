apiVersion: v1
kind: Secret
metadata:
  name: balancer-secrets
  namespace: load-balancer
type: Opaque
stringData:
  viewer-token: REPLACE_WITH_A_LONG_RANDOM_VIEWER_VALUE
  operator-token: REPLACE_WITH_A_LONG_RANDOM_OPERATOR_VALUE
  admin-token: REPLACE_WITH_A_LONG_RANDOM_VALUE
  discovery-token: REPLACE_WITH_A_LONG_RANDOM_DISCOVERY_VALUE
  metrics-token: REPLACE_WITH_A_LONG_RANDOM_METRICS_VALUE
  redis-password: REPLACE_WITH_REDIS_CREDENTIAL
  postgres-password: REPLACE_WITH_POSTGRES_CREDENTIAL
