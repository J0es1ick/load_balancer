apiVersion: apps/v1
kind: Deployment
metadata:
  name: balancer-console
  namespace: load-balancer
  labels: { app.kubernetes.io/name: balancer-console }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: balancer-console }
  template:
    metadata:
      labels: { app.kubernetes.io/name: balancer-console }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: ghcr.io/owner/cloud-test-assignment-frontend:v0.1.0
          env:
            - name: BALANCER_ADMIN_TOKEN
              valueFrom:
                { secretKeyRef: { name: balancer-secrets, key: admin-token } }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run, mountPath: /var/run }
      volumes:
        - { name: nginx-conf, emptyDir: { sizeLimit: 8Mi } }
        - { name: nginx-cache, emptyDir: { sizeLimit: 32Mi } }
        - { name: nginx-run, emptyDir: { sizeLimit: 8Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: balancer-console
  namespace: load-balancer
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: balancer-console }
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP: { timeoutSeconds: 10800 }
  ports:
    - { name: http, port: 80, targetPort: http }
