apiVersion: apps/v1
kind: Deployment
metadata:
  name: balancer
  namespace: load-balancer
  labels: { app.kubernetes.io/name: balancer }
spec:
  replicas: 3
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: balancer }
  template:
    metadata:
      labels: { app.kubernetes.io/name: balancer }
    spec:
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: balancer
          image: ghcr.io/owner/cloud-test-assignment-balancer:v0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: CONFIG_PATH, value: /config/config.yaml }
            - name: BALANCER_ADMIN_TOKEN
              valueFrom:
                { secretKeyRef: { name: balancer-secrets, key: admin-token } }
            - name: REDIS_PASSWORD
              valueFrom:
                {
                  secretKeyRef: { name: balancer-secrets, key: redis-password },
                }
            - name: POSTGRES_PASSWORD
              valueFrom:
                {
                  secretKeyRef:
                    { name: balancer-secrets, key: postgres-password },
                }
          ports:
            - { name: public, containerPort: 8080 }
            - { name: management, containerPort: 9090 }
          readinessProbe:
            httpGet: { path: /readyz, port: public }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: public }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /healthz, port: public }
            periodSeconds: 2
            failureThreshold: 30
          lifecycle:
            preStop:
              exec: { command: ["/bin/sh", "-c", "sleep 5"] }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: "2", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: balancer-config }
        - name: tmp
          emptyDir: { sizeLimit: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: balancer-public
  namespace: load-balancer
  labels: { app.kubernetes.io/name: balancer }
spec:
  selector: { app.kubernetes.io/name: balancer }
  ports:
    - { name: http, port: 80, targetPort: public }
---
apiVersion: v1
kind: Service
metadata:
  name: balancer
  namespace: load-balancer
  labels:
    {
      app.kubernetes.io/name: balancer,
      app.kubernetes.io/component: management,
    }
spec:
  selector: { app.kubernetes.io/name: balancer }
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP: { timeoutSeconds: 10800 }
  ports:
    - { name: management, port: 9090, targetPort: management }
