services:
  edge:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      CONSOLE_HOST: ${CONSOLE_HOST:-console.localhost}
    volumes:
      - ./deploy/edge/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "127.0.0.1:${EDGE_HTTPS_PORT:-8443}:8443"
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks:
      app:
        ipv4_address: 172.30.0.251

volumes:
  caddy_data:
  caddy_config:
