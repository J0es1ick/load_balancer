global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: go-load-balancer
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/admin_token
    static_configs:
      - targets: ["balancer:9090"]
        labels:
          environment: local-production-template
