services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_PUBLIC_URL: ${VITE_PUBLIC_URL:-http://localhost:8080/}
    environment:
      BALANCER_ADMIN_TOKEN: ${BALANCER_ADMIN_TOKEN:?copy .env.example to .env and set a token}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      balancer:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 10
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0750
      - /var/cache/nginx:uid=101,gid=101,mode=0750
      - /var/run:uid=101,gid=101,mode=0750
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks:
      app:
        ipv4_address: 172.30.0.10

  balancer:
    build: .
    environment:
      CONFIG_PATH: /config/config.yaml
      BALANCER_ADMIN_TOKEN: ${BALANCER_ADMIN_TOKEN:?copy .env.example to .env and set a token}
    ports:
      - "127.0.0.1:${BALANCER_PUBLIC_PORT:-8080}:8080"
    volumes:
      - ./config:/config:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: ["app"]

  redis:
    image: redis:8.8.1-alpine3.23
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: ["app"]

  backend1:
    image: nginx:1.28.3-alpine3.23
    volumes:
      - ./test/backend1:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: ["app"]

  backend2:
    image: nginx:1.28.3-alpine3.23
    volumes:
      - ./test/backend2:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: ["app"]

volumes:
  redis_data:

networks:
  app:
    ipam:
      config:
        - subnet: 172.30.0.0/24
