name: Quality, security and interactive docs

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.8.1-alpine3.23
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 10
      postgres:
        image: postgres:18.4-alpine3.23
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: balancer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d balancer"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 10
    env:
      TEST_REDIS_ADDRESS: 127.0.0.1:6379
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PASSWORD: integration-test-only
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting and module consistency
        shell: bash
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Unit and integration tests with race detector
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Vet and static analysis
        run: |
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Microbenchmarks
        run: go test -run '^$' -bench='Benchmark(RoundRobinStrategy|LocalStoreTake)$' -benchmem ./internal/...

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend checks and both production builds
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build:live
          npm run build:demo

      - name: Deployment manifests
        env:
          BALANCER_ADMIN_TOKEN: ci-only-management-token
          GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password
        run: |
          mkdir -p deploy/secrets
          printf '%s' "$BALANCER_ADMIN_TOKEN" > deploy/secrets/admin_token.txt
          docker compose config --quiet
          docker compose -f docker-compose.yml -f deploy/compose.edge.yml config --quiet
          docker compose -f docker-compose.yml -f deploy/compose.observability.yml config --quiet
          kubectl kustomize deploy/kubernetes/base >/dev/null
          kubectl kustomize deploy/kubernetes/optional >/dev/null

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build runtime image
        run: docker build --pull --tag load-balancer:ci .

      - name: Container vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: load-balancer:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  deployment-smoke:
    runs-on: ubuntu-latest
    needs: [quality, security]
    env:
      BALANCER_ADMIN_TOKEN: ci-only-management-token
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start deployment template
        run: docker compose up --build --detach

      - name: Wait for readiness
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null && curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          docker compose logs
          exit 1

      - name: k6 smoke profile
        run: docker run --rm --network host -v "${{ github.workspace }}/load:/scripts:ro" grafana/k6:1.7.1 run -e TARGET_URL=http://127.0.0.1:8080 -e PROFILE=smoke -e DURATION=10s /scripts/k6.js

      - name: k6 throughput profile without throttling
        shell: bash
        run: |
          curl --fail --silent --show-error -X PATCH -H 'Content-Type: application/json' --data '{"rate_limit":{"capacity":100000,"refill_per_second":100000}}' http://127.0.0.1:3000/api/dashboard/config >/dev/null
          docker compose exec -T redis redis-cli FLUSHDB >/dev/null
          docker run --rm --network host -v "${{ github.workspace }}/load:/scripts:ro" grafana/k6:1.7.1 run -e TARGET_URL=http://127.0.0.1:8080 -e PROFILE=throughput -e VUS=10 -e DURATION=15s /scripts/k6.js

      - name: k6 rate-limit profile proves 200 to 429 transition
        shell: bash
        run: |
          curl --fail --silent --show-error -X PATCH -H 'Content-Type: application/json' --data '{"rate_limit":{"capacity":20,"refill_per_second":1}}' http://127.0.0.1:3000/api/dashboard/config >/dev/null
          docker compose exec -T redis redis-cli FLUSHDB >/dev/null
          docker run --rm --network host -v "${{ github.workspace }}/load:/scripts:ro" grafana/k6:1.7.1 run -e TARGET_URL=http://127.0.0.1:8080 -e PROFILE=rate-limit -e VUS=5 -e DURATION=10s /scripts/k6.js

      - name: Stop deployment template
        if: always()
        run: docker compose down --volumes

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [quality, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build autonomous documentation
        working-directory: frontend
        env:
          VITE_APP_MODE: demo
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build:demo

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: frontend/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  release-images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, security, deployment-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Authenticate to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Create multi-platform builder
        run: docker buildx create --name release-builder --driver docker-container --use

      - name: Build and push signed release images
        id: images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          balancer_image="ghcr.io/${repository}-balancer:${GITHUB_REF_NAME}"
          frontend_image="ghcr.io/${repository}-frontend:${GITHUB_REF_NAME}"
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=mode=max --sbom=true --tag "$balancer_image" --push .
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=mode=max --sbom=true --tag "$frontend_image" --push ./frontend
          balancer_digest="$(docker buildx imagetools inspect "$balancer_image" --format '{{.Manifest.Digest}}')"
          frontend_digest="$(docker buildx imagetools inspect "$frontend_image" --format '{{.Manifest.Digest}}')"
          echo "balancer_image=$balancer_image" >> "$GITHUB_OUTPUT"
          echo "balancer_digest=$balancer_digest" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$frontend_image" >> "$GITHUB_OUTPUT"
          echo "frontend_digest=$frontend_digest" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Keyless-sign image digests
        env:
          BALANCER_IMAGE: ${{ steps.images.outputs.balancer_image }}
          BALANCER_DIGEST: ${{ steps.images.outputs.balancer_digest }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend_image }}
          FRONTEND_DIGEST: ${{ steps.images.outputs.frontend_digest }}
        run: |
          cosign sign --yes "${BALANCER_IMAGE}@${BALANCER_DIGEST}"
          cosign sign --yes "${FRONTEND_IMAGE}@${FRONTEND_DIGEST}"

      - name: Attest balancer provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.images.outputs.balancer_image }}
          subject-digest: ${{ steps.images.outputs.balancer_digest }}
          push-to-registry: true

      - name: Attest frontend provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.images.outputs.frontend_image }}
          subject-digest: ${{ steps.images.outputs.frontend_digest }}
          push-to-registry: true
