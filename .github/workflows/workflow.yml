name: Quality, security and interactive docs

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.8.1-alpine3.23@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 10
      postgres:
        image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: balancer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d balancer"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 10
    env:
      TEST_REDIS_ADDRESS: 127.0.0.1:6379
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PASSWORD: integration-test-only
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting and module consistency
        shell: bash
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Unit and integration tests with race detector
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Vet and static analysis
        run: |
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Microbenchmarks
        run: go test -run '^$' -bench='Benchmark(RoundRobinStrategy|LocalStoreTake)$' -benchmem ./internal/...

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend checks and both production builds
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run build:live
          npm run build:demo

      - name: Deployment manifests
        env:
          BALANCER_ADMIN_TOKEN: ci-only-management-token
          BALANCER_VIEWER_TOKEN: ci-only-viewer-token
          BALANCER_OPERATOR_TOKEN: ci-only-operator-token
          BALANCER_DISCOVERY_TOKEN: ci-only-discovery-token
          BALANCER_METRICS_TOKEN: ci-only-metrics-token
          GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password
        run: |
          mkdir -p deploy/secrets
          printf '%s' "$BALANCER_ADMIN_TOKEN" > deploy/secrets/admin_token.txt
          printf '%s' "$BALANCER_METRICS_TOKEN" > deploy/secrets/metrics_token.txt
          docker compose config --quiet
          docker compose -f docker-compose.yml -f deploy/compose.edge.yml config --quiet
          docker compose -f docker-compose.yml -f deploy/compose.observability.yml config --quiet
          go run ./cmd/balancer validate -config config/config.yaml
          go run ./cmd/balancer validate -config deploy/kubernetes/base/config/config.yaml
          go run ./cmd/balancer validate -config deploy/kubernetes/endpointslice/config.yaml
          go run ./cmd/balancer validate -config deploy/kubernetes/postgres-migration/config.yaml
          kubectl kustomize deploy/kubernetes/base >/dev/null
          kubectl kustomize deploy/kubernetes/endpointslice >/dev/null
          kubectl kustomize deploy/kubernetes/optional >/dev/null
          kubectl kustomize deploy/kubernetes/postgres-migration >/dev/null
          helm lint deploy/helm/load-balancer
          helm template ci deploy/helm/load-balancer --namespace load-balancer >/dev/null
          helm template ci deploy/helm/load-balancer --namespace load-balancer --show-only templates/configmap.yaml > /tmp/balancer-configmap.yaml
          awk 'found { sub(/^    /, ""); print } /^  config.yaml: \|$/ { found=1 }' /tmp/balancer-configmap.yaml > /tmp/balancer-config.yaml
          go run ./cmd/balancer validate -config /tmp/balancer-config.yaml
          helm lint deploy/helm/load-balancer -f deploy/helm/load-balancer/values-endpointslice.example.yaml
          helm template ci-discovery deploy/helm/load-balancer --namespace load-balancer -f deploy/helm/load-balancer/values-endpointslice.example.yaml >/dev/null
          helm template ci-discovery deploy/helm/load-balancer --namespace load-balancer -f deploy/helm/load-balancer/values-endpointslice.example.yaml --show-only templates/configmap.yaml > /tmp/balancer-discovery-configmap.yaml
          awk 'found { sub(/^    /, ""); print } /^  config.yaml: \|$/ { found=1 }' /tmp/balancer-discovery-configmap.yaml > /tmp/balancer-discovery-config.yaml
          go run ./cmd/balancer validate -config /tmp/balancer-discovery-config.yaml
          if helm template insecure-discovery deploy/helm/load-balancer --set discovery.enabled=true >/dev/null 2>&1; then
            echo 'plaintext discovery rendered without explicit opt-in' >&2
            exit 1
          fi
          if helm template isolated-discovery deploy/helm/load-balancer -f deploy/helm/load-balancer/values-endpointslice.example.yaml --set networkPolicy.egress.enabled=true >/dev/null 2>&1; then
            echo 'EndpointSlice discovery rendered without an API-server egress rule' >&2
            exit 1
          fi

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Gitleaks scans the complete pushed commit range. A shallow clone can
          # omit the parent of the first commit and turn a clean scan into an
          # "ambiguous argument" infrastructure failure.
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build runtime image
        run: docker build --pull --tag load-balancer:ci .

      - name: Build frontend runtime image
        id: build_frontend
        run: docker build --pull --tag load-balancer-frontend:ci ./frontend

      - name: Container vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: load-balancer:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Frontend container vulnerability scan
        if: ${{ !cancelled() && steps.build_frontend.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: load-balancer-frontend:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Frontend startup contract
        run: |
          docker run --rm --network none --add-host balancer:127.0.0.1 \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /etc/nginx/conf.d:uid=101,gid=101,mode=0750 \
            --tmpfs /var/cache/nginx:uid=101,gid=101,mode=0750 \
            --tmpfs /var/run:uid=101,gid=101,mode=0750 --tmpfs /tmp \
            --mount "type=bind,src=${{ github.workspace }}/frontend/scripts/test-container-startup.sh,dst=/tmp/test-container-startup.sh,readonly" \
            --entrypoint sh load-balancer-frontend:ci /tmp/test-container-startup.sh

  deployment-smoke:
    runs-on: ubuntu-latest
    needs: [quality, security]
    env:
      BALANCER_ADMIN_TOKEN: ci-only-management-token
      BALANCER_VIEWER_TOKEN: ci-only-viewer-token
      BALANCER_OPERATOR_TOKEN: ci-only-operator-token
      BALANCER_DISCOVERY_TOKEN: ci-only-discovery-token
      BALANCER_METRICS_TOKEN: ci-only-metrics-token
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start deployment template
        run: docker compose up --build --detach

      - name: Wait for readiness
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null && curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          docker compose logs
          exit 1

      - name: k6 smoke profile
        run: docker run --rm --network host -v "${{ github.workspace }}/load:/scripts:ro" grafana/k6:1.7.1@sha256:4fd3a694926b064d3491d9b02b01cde886583c4931f1223816e3d9a7bdfa7e0f run -e TARGET_URL=http://127.0.0.1:8080 -e PROFILE=smoke -e DURATION=10s /scripts/k6.js

      - name: k6 throughput profile without throttling
        shell: bash
        run: |
          curl --fail --silent --show-error -X PATCH -H 'Content-Type: application/json' -H 'X-Balancer-CSRF: 1' --data '{"capacity":100000,"refill_per_second":100000}' http://127.0.0.1:3000/api/v1/rate-limit >/dev/null
          for backend in backend-{3..8}; do
            curl --fail --silent --show-error -X PATCH -H 'Content-Type: application/json' -H 'X-Balancer-CSRF: 1' --data '{"enabled":true}' "http://127.0.0.1:3000/api/v1/clusters/primary/endpoints/${backend}" >/dev/null
          done
          for attempt in {1..30}; do
            if [ "$(curl --fail --silent http://127.0.0.1:3000/api/v1/status | jq '[.gateway.clusters[] | select(.id == "primary") | .endpoints[] | select(.available)] | length')" = "8" ]; then break; fi
            sleep 1
          done
          test "$(curl --fail --silent http://127.0.0.1:3000/api/v1/status | jq '[.gateway.clusters[] | select(.id == "primary") | .endpoints[] | select(.available)] | length')" = "8"
          docker compose exec -T redis redis-cli FLUSHDB >/dev/null
          docker run --rm --network host -v "${{ github.workspace }}/load:/scripts:ro" grafana/k6:1.7.1@sha256:4fd3a694926b064d3491d9b02b01cde886583c4931f1223816e3d9a7bdfa7e0f run -e TARGET_URL=http://127.0.0.1:8080 -e PROFILE=throughput -e RATE=100 -e PRE_ALLOCATED_VUS=20 -e MAX_VUS=100 -e DURATION=15s -e EXPECTED_BACKENDS=backend-1,backend-2,backend-3,backend-4,backend-5,backend-6,backend-7,backend-8 -e 'BACKEND_PATTERNS_JSON={"backend-1":"Backend 1","backend-2":"Backend 2","backend-3":"Backend 3","backend-4":"Backend 4","backend-5":"Backend 5","backend-6":"Backend 6","backend-7":"Backend 7","backend-8":"Backend 8"}' -e SUMMARY_PATH=/tmp/throughput-report.json /scripts/k6.js

      - name: k6 rate-limit profile proves 200 to 429 transition
        shell: bash
        run: |
          curl --fail --silent --show-error -X PATCH -H 'Content-Type: application/json' -H 'X-Balancer-CSRF: 1' --data '{"capacity":20,"refill_per_second":1}' http://127.0.0.1:3000/api/v1/rate-limit >/dev/null
          docker compose exec -T redis redis-cli FLUSHDB >/dev/null
          docker run --rm --network host -v "${{ github.workspace }}/load:/scripts:ro" grafana/k6:1.7.1@sha256:4fd3a694926b064d3491d9b02b01cde886583c4931f1223816e3d9a7bdfa7e0f run -e TARGET_URL=http://127.0.0.1:8080 -e PROFILE=rate-limit -e RATE=5 -e DURATION=10s -e SUMMARY_PATH=/tmp/rate-limit-report.json /scripts/k6.js

      - name: Deployment diagnostics
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=100

      - name: Stop deployment template
        if: always()
        run: docker compose down --volumes

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    needs: [quality, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build autonomous documentation
        working-directory: frontend
        env:
          VITE_APP_MODE: demo
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build:demo

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: frontend/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  release-images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, security, deployment-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Authenticate to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Create multi-platform builder
        run: docker buildx create --name release-builder --driver docker-container --use

      - name: Build and push signed release images
        id: images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          balancer_image="ghcr.io/${repository}-balancer:${GITHUB_REF_NAME}"
          frontend_image="ghcr.io/${repository}-frontend:${GITHUB_REF_NAME}"
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=mode=max --sbom=true --build-arg VERSION="$GITHUB_REF_NAME" --build-arg COMMIT="$GITHUB_SHA" --build-arg BUILD_DATE="$build_date" --tag "$balancer_image" --push .
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=mode=max --sbom=true --tag "$frontend_image" --push ./frontend
          balancer_digest="$(docker buildx imagetools inspect "$balancer_image" --format '{{.Manifest.Digest}}')"
          frontend_digest="$(docker buildx imagetools inspect "$frontend_image" --format '{{.Manifest.Digest}}')"
          echo "balancer_image=$balancer_image" >> "$GITHUB_OUTPUT"
          echo "balancer_digest=$balancer_digest" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$frontend_image" >> "$GITHUB_OUTPUT"
          echo "frontend_digest=$frontend_digest" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Keyless-sign image digests
        env:
          BALANCER_IMAGE: ${{ steps.images.outputs.balancer_image }}
          BALANCER_DIGEST: ${{ steps.images.outputs.balancer_digest }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend_image }}
          FRONTEND_DIGEST: ${{ steps.images.outputs.frontend_digest }}
        run: |
          cosign sign --yes "${BALANCER_IMAGE}@${BALANCER_DIGEST}"
          cosign sign --yes "${FRONTEND_IMAGE}@${FRONTEND_DIGEST}"

      - name: Verify release signatures before attestation
        env:
          BALANCER_IMAGE: ${{ steps.images.outputs.balancer_image }}
          BALANCER_DIGEST: ${{ steps.images.outputs.balancer_digest }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend_image }}
          FRONTEND_DIGEST: ${{ steps.images.outputs.frontend_digest }}
        run: |
          identity="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/workflow.yml@refs/tags/v"
          cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com "${BALANCER_IMAGE}@${BALANCER_DIGEST}"
          cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com "${FRONTEND_IMAGE}@${FRONTEND_DIGEST}"

      - name: Attest balancer provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.images.outputs.balancer_image }}
          subject-digest: ${{ steps.images.outputs.balancer_digest }}
          push-to-registry: true

      - name: Attest frontend provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.images.outputs.frontend_image }}
          subject-digest: ${{ steps.images.outputs.frontend_digest }}
          push-to-registry: true
